# override from ArgoCD App
# UUID of the locally-managed tunnel, see README.md
tunnelId: ""
# Zone whose subdomains are routed through the tunnel
domain: ""

# Traefik service receiving all tunnel traffic, see infrastructure/traefik
origin: http://traefik-cloudflare.traefik.svc.cluster.local:80

replicas: 2

# Addresses of region1.v2.argotunnel.com and region2.v2.argotunnel.com, allowed by
# the NetworkPolicy. Check with: dig +short region1.v2.argotunnel.com region2.v2.argotunnel.com
# https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/tunnel-with-firewall/
edgeCIDRs:
  - 198.41.192.0/24
  - 198.41.200.0/24

image:
  repository: cloudflare/cloudflared
  tag: 2026.11.0

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
