# Relay VPS configured by relay/playbook.yml in the repository root
vps:
  # IP address instead of relay.wildfreddy.net, since the pod has no DNS access,
  # and the NetworkPolicy needs an address
  address: 172.232.4.234
  port: 51820
  # WireGuard public key printed by the playbook
  publicKey: "E3dBH2YNlf/vEoAkoEyRiJcvjqA/nAGitpXqiWVVyn8="
  # Address of the VPS end of the tunnel
  tunnelAddress: 10.99.0.1

# Address of the cluster end of the tunnel
tunnelAddress: 10.99.0.2

# Forwarded from the VPS through the tunnel to the same port on the destination,
# see relay/group_vars/relay.yml.
# to: NetworkPolicy peers for the destination, instead of its IP address.
forwards:
  # WireGuard VPN
  - protocol: UDP
    port: 14585
    destination: 192.168.8.1
  # HTTPS from HAProxy to the Traefik websecure-relay entrypoint on the traefik-relay Service ClusterIP,
  # which is fixed in infrastructure/traefik/values.yaml
  - protocol: TCP
    port: 6443
    destination: 10.43.0.20
    # kube-proxy replaces the ClusterIP with a Traefik pod IP address
    # before the NetworkPolicy checks the connection
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik

# Only used for the tools: wg, wg-quick, ip, iptables. run.sh replaces the image's OpenRC init.
# v1.0.<date> is the wireguard-tools release. The tag is rebuilt weekly, so the digest pins the image.
image:
  repository: docker.io/procustodibus/wireguard
  tag: v1.0.20260223@sha256:f95b365bc233f67c4f3c9c286678f93ee42bd8b42a4bcaebd202f8d480ea0394

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
