apiVersion: v1
kind: ConfigMap
metadata:
  name: relay
data:
  # https://man7.org/linux/man-pages/man8/wg-quick.8.html
  # generate-config.sh adds PrivateKey from the sealed secret
  wg0.conf: |
    [Interface]
    Address = {{ .Values.tunnelAddress }}/24
    {{- range .Values.forwards }}
    # Forwarded from the VPS
    PostUp = iptables -t nat -A PREROUTING -i %i -p {{ lower .protocol }} --dport {{ .port }} -j DNAT --to-destination {{ .destination }}
    PostDown = iptables -t nat -D PREROUTING -i %i -p {{ lower .protocol }} --dport {{ .port }} -j DNAT --to-destination {{ .destination }}
    {{- end }}
    # The destinations can't reach the tunnel address, so they reply to the pod,
    # which sends the replies back through the tunnel
    PostUp = iptables -t nat -A POSTROUTING -o eth0 -m conntrack --ctstate DNAT -j MASQUERADE
    PostDown = iptables -t nat -D POSTROUTING -o eth0 -m conntrack --ctstate DNAT -j MASQUERADE

    [Peer]
    # relay VPS
    PublicKey = {{ required "vps.publicKey is printed by relay/playbook.yml" .Values.vps.publicKey }}
    Endpoint = {{ .Values.vps.address }}:{{ .Values.vps.port }}
    AllowedIPs = {{ .Values.vps.tunnelAddress }}/32
    # The home connection is behind CGNAT, so the tunnel is always started from this end.
    # Keepalives hold the NAT mapping open, so packets from the VPS can reach the pod.
    PersistentKeepalive = 25

  # Init container: writes wg0.conf with the private key to the in-memory config volume.
  generate-config.sh: |
    #!/bin/sh
    set -e
    umask 077
    awk -v key_file=/secret/wireguard-key/private-key '
      { print }
      /^\[Interface\]$/ { getline key < key_file; print "PrivateKey = " key }
    ' /template/wireguard/wg0.conf > /etc/wireguard/wg0.conf

  # Replaces the image's OpenRC init: bring up the interface, then wait until the pod stops.
  run.sh: |
    #!/bin/sh
    set -e
    # wg-quick names the interface after the file.
    config=/etc/wireguard/wg0.conf
    wg-quick up "$config"
    trap 'wg-quick down "$config"; exit 0' TERM INT
    while true; do
      sleep 3600 &
      wait $!
    done
