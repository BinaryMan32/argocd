apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  labels:
    app.kubernetes.io/name: relay
  annotations:
    # wg-quick only reads its config and key at startup
    reloader.stakater.com/auto: "true"
spec:
  # Must stay at 1: the VPS has one peer for this key, and two pods would keep replacing
  # each other's endpoint. Recreate avoids overlapping pods during updates.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "/opt/relay/generate-config.sh"]
          securityContext:
            # root only to read the key, which is owned by root. No capabilities needed.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-template
              mountPath: /template/wireguard
              readOnly: true
            - name: secret
              mountPath: /secret/wireguard-key
              readOnly: true
            - name: script
              mountPath: /opt/relay
              readOnly: true
            - name: config
              mountPath: /etc/wireguard
      containers:
        - name: wireguard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "/opt/relay/run.sh"]
          # Ready while the last handshake with the VPS is recent. Handshakes repeat every
          # 2 minutes while the keepalives are flowing.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(wg show wg0 latest-handshakes | cut -f2) )) -lt 180
            periodSeconds: 30
          securityContext:
            # wg-quick and ip need root with NET_ADMIN, which only applies to the pod's
            # own network namespace. The kernel WireGuard module comes from the node.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: script
              mountPath: /opt/relay
              readOnly: true
            - name: config
              mountPath: /etc/wireguard
              readOnly: true
      volumes:
        # wg0.conf without the private key
        - name: config-template
          configMap:
            name: relay
            items:
              - key: wg0.conf
                path: wg0.conf
            defaultMode: 0400
        - name: secret
          secret:
            secretName: relay-wireguard-key
            defaultMode: 0400
        - name: script
          configMap:
            name: relay
            items:
              - key: generate-config.sh
                path: generate-config.sh
              - key: run.sh
                path: run.sh
        # wg0.conf with the private key, written by generate-config.sh.
        # In memory, like the secret volume, so the key is never written to the node's disk.
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
