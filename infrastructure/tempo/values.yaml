tempo:
  # https://github.com/grafana-community/helm-charts/blob/main/charts/tempo/values.yaml
  persistence:
    # keep the live-store WAL across restarts
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  serviceMonitor:
    enabled: true
  tempo:
    extraArgs:
      # expand environment variables in the config file, such as s3 credentials below
      config.expand-env: true
    extraEnv:
      - name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: seaweedfs-s3-user-tempo
            key: access-key-id
      - name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: seaweedfs-s3-user-tempo
            key: secret-access-key
    # 7 days retention
    retention: 168h
    storage:
      trace:
        backend: s3
        s3:
          access_key: "${S3_ACCESS_KEY_ID}"
          secret_key: "${S3_SECRET_ACCESS_KEY}"
          bucket: "tempo"
          endpoint: seaweedfs-s3.seaweedfs:8333
          insecure: true
