# https://cloudnative-pg.io/plugin-barman-cloud/docs/object_stores/
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: lldap-seaweedfs
spec:
  configuration:
    destinationPath: s3://lldap-cnpg
    endpointURL: http://seaweedfs-s3.seaweedfs:8333
    s3Credentials:
      accessKeyId:
        name: seaweedfs-s3-user-lldap-cnpg
        key: access-key-id
      secretAccessKey:
        name: seaweedfs-s3-user-lldap-cnpg
        key: secret-access-key
    wal:
      compression: bzip2
    data:
      compression: bzip2
  retentionPolicy: 21d
