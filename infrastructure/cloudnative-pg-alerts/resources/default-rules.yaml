# Default alerts from the cloudnative-pg docs, unchanged except for omissions. See ../README.md before editing.
# renovate: datasource=github-tags depName=cloudnative-pg/cloudnative-pg
# https://github.com/cloudnative-pg/cloudnative-pg/tree/v1.30.1/docs/src/samples/monitoring/prometheusrule.yaml
# Omitted:
# - BackendsWaiting: compares a count of blocked lock waits to 300, as if it were seconds
#                    covered by LongRunningTransaction, when backends blocked for 5 minutes
# - PGReplication: covered by CNPGClusterPhysicalReplicationLagCritical
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-default
spec:
  groups:
    - name: cnp-default.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabaseXidAge
          annotations:
            description: Over 300,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
            and on(namespace, pod) cnpg_pg_replication_in_recovery == 0
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There have been over 10 deadlocks in the last hour in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            increase(cnpg_pg_stat_database_deadlocks[1h]) > 10
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
