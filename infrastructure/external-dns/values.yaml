# https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
# Both instances manage the same zone with the same API token. Each one only
# changes records with a TXT ownership record matching its txtOwnerId.

# Routes attached to the traefik-cloudflare Gateway: proxied CNAME to the tunnel
tunnel:
  provider:
    name: cloudflare
  env:
    # https://github.com/kubernetes-sigs/external-dns/blob/master/docs/tutorials/cloudflare.md
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: token
  sources:
    - gateway-httproute
  gatewayNamespace: traefik
  # Remove records when routes are deleted
  policy: sync
  txtOwnerId: griffin
  # override from ArgoCD App
  domainFilters: []
  extraArgs:
    gateway-name: traefik-cloudflare
    # Records point to the tunnel, which only works through the Cloudflare proxy
    cloudflare-proxied: true
    # override from ArgoCD App: required because the API token is limited to specific zones
    zone-id-filter: null
  serviceMonitor:
    enabled: true

# Routes attached to the traefik-external Gateway: DNS-only CNAME to the relay VPS record
direct:
  provider:
    name: cloudflare
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: token
  sources:
    - gateway-httproute
  gatewayNamespace: traefik
  policy: sync
  txtOwnerId: griffin-direct
  # override from ArgoCD App
  domainFilters: []
  extraArgs:
    gateway-name: traefik-external
    # Not proxied (the default), traffic goes directly to the relay VPS
    # override from ArgoCD App: required because the API token is limited to specific zones
    zone-id-filter: null
  serviceMonitor:
    enabled: true
