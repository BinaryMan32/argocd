apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.source.repoURL }}
    targetRevision: {{ .Values.source.targetRevision }}
    path: {{ .Values.project.path }}/external-dns
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        external-dns:
          domainFilters:
            - {{ .Values.domain.tunnel }}
          extraArgs:
            zone-id-filter: {{ .Values.cloudflare.tunnelZoneId | quote }}
  destination:
    namespace: cloudflare
    server: {{ .Values.destination.server }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
