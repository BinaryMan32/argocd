apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.source.repoURL }}
    targetRevision: {{ .Values.source.targetRevision }}
    path: {{ .Values.project.path }}/external-dns
    helm:
      skipCrds: true
      valueFiles:
        - values.yaml
      valuesObject:
        tunnel:
          domainFilters:
            - {{ .Values.domain.public }}
          extraArgs:
            zone-id-filter: {{ .Values.cloudflare.zoneId | quote }}
        direct:
          domainFilters:
            - {{ .Values.domain.public }}
            - {{ .Values.domain.playwhen }}
          extraArgs:
            zone-id-filter:
              - {{ .Values.cloudflare.zoneId | quote }}
              - {{ .Values.cloudflare.playwhenZoneId | quote }}
  destination:
    namespace: cloudflare
    server: {{ .Values.destination.server }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
