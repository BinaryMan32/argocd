apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    # https://github.com/cloudnative-pg/grafana-dashboards
    repoURL: https://cloudnative-pg.github.io/grafana-dashboards
    chart: cluster
    targetRevision: 0.0.5
  destination:
    namespace: cnpg-system
    server: {{ .Values.destination.server }}
  syncPolicy:
    automated: {}
    syncOptions:
      # dashboard ConfigMap exceeds the 256KiB last-applied-configuration annotation limit
      - ServerSideApply=true
