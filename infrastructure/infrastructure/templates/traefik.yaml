apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.source.repoURL }}
    targetRevision: {{ .Values.source.targetRevision }}
    path: "{{ .Values.project.path }}/traefik"
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        dashboard:
          hostname: "traefik.{{ .Values.domain.intranet }}"
        playWhenRedirect:
          intranet:
            hostnames:
              - "www.dev.playwhen.{{ .Values.domain.intranet }}"
              - "www.stage.playwhen.{{ .Values.domain.intranet }}"
          external:
            hostnames:
              - "www.{{ .Values.domain.playwhen }}"
        intranet:
          wildcardCertificates:
            argocd-wildcard-intranet-tls:
              dnsNames:
                - "*.argocd.{{ .Values.domain.intranet }}"
            foundry-vtt-wildcard-intranet-tls:
              dnsNames:
                - "*.foundry-vtt.{{ .Values.domain.intranet }}"
            play-when-dev-tls:
              dnsNames:
                - "*.dev.playwhen.{{ .Values.domain.intranet }}"
            play-when-stage-tls:
              dnsNames:
                - "*.stage.playwhen.{{ .Values.domain.intranet }}"
            root-wildcard-intranet-tls:
              dnsNames:
                - "*.{{ .Values.domain.intranet }}"
          gateway:
            listeners:
              https:
                alertmanager:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "alertmanager.{{ .Values.domain.intranet }}"
                  namespace: kube-prometheus-stack
                argocd:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "argocd.{{ .Values.domain.intranet }}"
                  namespace: argocd
                argocd-grpc:
                  certificateRef: argocd-wildcard-intranet-tls
                  hostname: "grpc.argocd.{{ .Values.domain.intranet }}"
                  namespace: argocd
                audiobookshelf:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "audiobookshelf.{{ .Values.domain.intranet }}"
                  namespace: media
                authelia:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "auth.{{ .Values.domain.intranet }}"
                  namespace: auth
                bazarr:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "bazarr.{{ .Values.domain.intranet }}"
                  namespace: media
                foundry-vtt:
                  certificateRef: foundry-vtt-wildcard-intranet-tls
                  hostname: "*.foundry-vtt.{{ .Values.domain.intranet }}"
                  namespace: foundry-vtt
                grafana:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "grafana.{{ .Values.domain.intranet }}"
                  namespace: kube-prometheus-stack
                headlamp:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "headlamp.{{ .Values.domain.intranet }}"
                  namespace: headlamp
                home-assistant:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "home-assistant.{{ .Values.domain.intranet }}"
                  namespace: home-assistant
                homebox:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "homebox.{{ .Values.domain.intranet }}"
                  namespace: homebox
                homepage:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "homepage.{{ .Values.domain.intranet }}"
                  namespace: homepage
                jaeger:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "jaeger.{{ .Values.domain.intranet }}"
                  namespace: jaeger
                jellyfin:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "jellyfin.{{ .Values.domain.intranet }}"
                  namespace: media
                lldap:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "lldap.{{ .Values.domain.intranet }}"
                  namespace: auth
                longhorn:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "longhorn.{{ .Values.domain.intranet }}"
                  namespace: longhorn-system
                pihole:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "pihole.{{ .Values.domain.intranet }}"
                  namespace: pihole
                play-when-dev:
                  certificateRef: play-when-dev-tls
                  hostname: "*.dev.playwhen.{{ .Values.domain.intranet }}"
                  namespace: play-when-dev
                play-when-stage:
                  certificateRef: play-when-stage-tls
                  hostname: "*.stage.playwhen.{{ .Values.domain.intranet }}"
                  namespace: play-when-stage
                prometheus:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "prometheus.{{ .Values.domain.intranet }}"
                  namespace: kube-prometheus-stack
                prowlarr:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "prowlarr.{{ .Values.domain.intranet }}"
                  namespace: media
                qbittorrent:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "qbittorrent.{{ .Values.domain.intranet }}"
                  namespace: media
                radarr:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "radarr.{{ .Values.domain.intranet }}"
                  namespace: media
                seaweedfs-admin:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "seaweedfs-admin.{{ .Values.domain.intranet }}"
                  namespace: seaweedfs
                seaweedfs-s3:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "seaweedfs-s3.{{ .Values.domain.intranet }}"
                  namespace: seaweedfs
                seerr:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "seerr.{{ .Values.domain.intranet }}"
                  namespace: media
                sonarr:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "sonarr.{{ .Values.domain.intranet }}"
                  namespace: media
                tandoor-recipes:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "tandoor.{{ .Values.domain.intranet }}"
                  namespace: tandoor-recipes
                traefik-dashboard:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "traefik.{{ .Values.domain.intranet }}"
                tududi:
                  certificateRef: root-wildcard-intranet-tls
                  hostname: "tududi.{{ .Values.domain.intranet }}"
                  namespace: tududi
        external:
          wildcardCertificates:
            argocd-wildcard-external-tls:
              dnsNames:
                - "*.argocd.{{ .Values.domain.external }}"
            foundry-vtt-wildcard-external-tls:
              dnsNames:
                - "*.foundry-vtt.{{ .Values.domain.external }}"
            play-when-prod-tls:
              dnsNames:
                - "*.{{ .Values.domain.playwhen }}"
            root-wildcard-external-tls:
              dnsNames:
                - "*.{{ .Values.domain.external }}"
          gateway:
            listeners:
              https:
                argocd-github-webhook:
                  certificateRef: argocd-wildcard-external-tls
                  hostname: "github-webhook.argocd.{{ .Values.domain.external }}"
                  namespace: argocd
                argocd-gitlab-webhook:
                  certificateRef: argocd-wildcard-external-tls
                  hostname: "gitlab-webhook.argocd.{{ .Values.domain.external }}"
                  namespace: argocd
                foundry-vtt:
                  certificateRef: foundry-vtt-wildcard-external-tls
                  hostname: "*.foundry-vtt.{{ .Values.domain.external }}"
                  namespace: foundry-vtt
                jellyfin:
                  certificateRef: root-wildcard-external-tls
                  hostname: "jellyfin.{{ .Values.domain.external }}"
                  namespace: media
                navidrome:
                  certificateRef: root-wildcard-external-tls
                  hostname: "navidrome.{{ .Values.domain.external }}"
                  namespace: media
                nextcloud:
                  certificateRef: root-wildcard-external-tls
                  hostname: "nextcloud.{{ .Values.domain.external }}"
                  namespace: nextcloud
                play-when-prod:
                  certificateRef: play-when-prod-tls
                  hostname: "*.{{ .Values.domain.playwhen }}"
                  namespace: play-when-prod
        # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
        traefik:
          service:
            spec:
              loadBalancerIP: {{ .Values.ipAddress.traefikIntranet }}
            additionalServices:
              external:
                spec:
                  loadBalancerIP: {{ .Values.ipAddress.traefikExternal }}
  destination:
    namespace: traefik
    server: {{ .Values.destination.server }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
