# https://github.com/seaweedfs/seaweedfs/blob/master/k8s/charts/seaweedfs/values.yaml
seaweedfs:
  global:
    monitoring:
      enabled: true

  master:
    replicas: 1
    nodeSelector: |
      kubernetes.io/arch: arm64
    volumeSizeLimitMB: 16384
    # Set default replication (0 copies in different datacenters, 2 copies in different racks, 0 copies in same rack)
    defaultReplication: "020"
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  volume:
    # `volume` values are defaults, groups are defined in `volumes` below
    enabled: false
    dataDirs:
      - name: ssd
        type: persistentVolumeClaim
        storageClass: topolvm-ssd-xfs
        size: 256Gi
        maxVolumes: 0
    # Keep off griffin3 so it can be taken offline for experiments.
    # Preserve chart default podAntiAffinity (one pod per node).
    affinity: |
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - griffin3
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                app.kubernetes.io/component: {{ $volumeName }}
            topologyKey: kubernetes.io/hostname

  volumes:
    griffin-turing0:
      replicas: 3
      rack: "turing0"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing0"
    griffin-turing1:
      replicas: 3
      rack: "turing1"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing1"
    griffin-turing2:
      replicas: 3
      rack: "turing2"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing2"

  filer:
    replicas: 1
    nodeSelector: |
      kubernetes.io/arch: arm64
    # Set default replication (0 copies in different datacenters, 2 copies in different racks, 0 copies in same rack)
    defaultReplicaPlacement: "020"
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-config
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  s3:
    enableAuth: true

  admin:
    enabled: true
    allowInsecureBind: true
    nodeSelector: |
      kubernetes.io/arch: arm64
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  worker:
    enabled: true
    # Exclude erasure_coding (in "heavy"/"all"): it replaces replicated volumes with EC shards,
    # which can't survive losing a whole rack/zone with only 3.
    jobType: default
    nodeSelector: |
      kubernetes.io/arch: arm64

  networkPolicy:
    enabled: true
    # Allow prometheus to scrape metrics from all components (see `global.monitoring.enabled` above)
    extraIngress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-prometheus-stack
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/instance: kube-prometheus-stack-prometheus
        ports:
          - protocol: TCP
            port: metrics
    components:
      # Allow traefik to access `admin` (see `admin.httpRoute` below)
      admin:
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                    app.kubernetes.io/instance: traefik
            ports:
              - protocol: TCP
                port: admin
      filer:
        extraIngress:
          # Allow traefik to access `s3` on the `filer` (see `filer.httpRoute` below)
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                    app.kubernetes.io/instance: traefik
            ports:
              - protocol: TCP
                port: swfs-s3
          # Allow CNPG (barman-cloud plugin sidecar) to access `s3` on the `filer`
          - from:
              - namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - play-when-dev
                        - play-when-stage
                        - play-when-prod
                podSelector:
                  matchExpressions:
                    - key: cnpg.io/cluster
                      operator: Exists
            ports:
              - protocol: TCP
                port: swfs-s3

admin:
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-intranet
        namespace: traefik
    filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: authelia
s3:
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-intranet
        namespace: traefik
