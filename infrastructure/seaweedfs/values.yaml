# https://github.com/seaweedfs/seaweedfs/blob/master/k8s/charts/seaweedfs/values.yaml
seaweedfs:
  global:
    monitoring:
      enabled: true

  master:
    replicas: 1
    nodeSelector: |
      kubernetes.io/arch: arm64
    volumeSizeLimitMB: 16384
    # Set default replication (0 copies in different datacenters, 2 copies in different racks, 0 copies in same rack)
    defaultReplication: "020"
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  volume:
    # `volume` values are defaults, groups are defined in `volumes` below
    enabled: false
    dataDirs:
      - name: ssd
        type: persistentVolumeClaim
        storageClass: topolvm-ssd-xfs
        size: 256Gi
        maxVolumes: 0

  volumes:
    griffin-turing0:
      replicas: 3
      rack: "turing0"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing0"
    griffin-turing1:
      replicas: 3
      rack: "turing1"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing1"
    griffin-turing2:
      replicas: 2
      rack: "turing2"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing2"

  filer:
    replicas: 1
    nodeSelector: |
      kubernetes.io/arch: arm64
    # Set default replication (0 copies in different datacenters, 2 copies in different racks, 0 copies in same rack)
    defaultReplicaPlacement: "020"
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-config
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  s3:
    enableAuth: true

  admin:
    enabled: true
    allowInsecureBind: true
    nodeSelector: |
      kubernetes.io/arch: arm64
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  worker:
    enabled: true
    nodeSelector: |
      kubernetes.io/arch: arm64

  networkPolicy:
    enabled: true
    # Allow prometheus to scrape metrics from all components (see `global.monitoring.enabled` above)
    extraIngress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-prometheus-stack
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/instance: kube-prometheus-stack-prometheus
        ports:
          - protocol: TCP
            port: http
    components:
      # Allow traefik to access `admin` (see `admin.httpRoute` below)
      admin:
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                    app.kubernetes.io/instance: traefik
            ports:
              - protocol: TCP
                port: http
      # Allow traefik to access `s3` (see `s3.httpRoute` below)
      s3:
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                    app.kubernetes.io/instance: traefik
            ports:
              - protocol: TCP
                port: http

admin:
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-intranet
        namespace: traefik
    filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: authelia
s3:
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-intranet
        namespace: traefik
