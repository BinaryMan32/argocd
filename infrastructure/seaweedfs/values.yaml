# https://github.com/seaweedfs/seaweedfs/blob/master/k8s/charts/seaweedfs/values.yaml
seaweedfs:
  global:
    monitoring:
      enabled: true

  master:
    replicas: 1
    nodeSelector: |
      kubernetes.io/arch: arm64
    # Each volume consumes this when computing the max volumes per server.
    # A larger limit than a typical bucket size will artificially limit the number of buckets.
    # Buckets allocate additional volumes as their size increases.
    volumeSizeLimitMB: 4096
    # Set default replication (0 copies in different datacenters, 2 copies in different racks, 0 copies in same rack)
    defaultReplication: "020"
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  volume:
    # `volume` values are defaults, groups are defined in `volumes` below
    enabled: false
    dataDirs:
      - name: ssd
        type: persistentVolumeClaim
        storageClass: topolvm-ssd-xfs
        size: 256Gi
        maxVolumes: 0
    # Keep off griffin3 so it can be taken offline for experiments.
    # Preserve chart default podAntiAffinity (one pod per node).
    affinity: |
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - griffin3
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                app.kubernetes.io/component: {{ $volumeName }}
            topologyKey: kubernetes.io/hostname

  volumes:
    griffin-turing0:
      replicas: 3
      rack: "turing0"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing0"
    griffin-turing1:
      replicas: 3
      rack: "turing1"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing1"
    griffin-turing2:
      replicas: 3
      rack: "turing2"
      dataCenter: "griffin"
      nodeSelector: |
        topology.kubernetes.io/zone: "turing2"

  filer:
    replicas: 1
    nodeSelector: |
      kubernetes.io/arch: arm64
    # Set default replication (0 copies in different datacenters, 2 copies in different racks, 0 copies in same rack)
    defaultReplicaPlacement: "020"
    # S3 credentials referenced by `s3.identities` below, see create-sealed-secret-s3-user.sh
    secretExtraEnvironmentVars:
      S3_USER_ADMIN_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-admin
          key: access-key-id
      S3_USER_ADMIN_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-admin
          key: secret-access-key
      S3_USER_READONLY_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-readonly
          key: access-key-id
      S3_USER_READONLY_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-readonly
          key: secret-access-key
      S3_USER_NEXTCLOUD_CNPG_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-nextcloud-cnpg
          key: access-key-id
      S3_USER_NEXTCLOUD_CNPG_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-nextcloud-cnpg
          key: secret-access-key
      S3_USER_AUTHELIA_CNPG_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-authelia-cnpg
          key: access-key-id
      S3_USER_AUTHELIA_CNPG_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-authelia-cnpg
          key: secret-access-key
      S3_USER_LLDAP_CNPG_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-lldap-cnpg
          key: access-key-id
      S3_USER_LLDAP_CNPG_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-lldap-cnpg
          key: secret-access-key
      S3_USER_PLAY_WHEN_DEV_CNPG_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-play-when-dev-cnpg
          key: access-key-id
      S3_USER_PLAY_WHEN_DEV_CNPG_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-play-when-dev-cnpg
          key: secret-access-key
      S3_USER_PLAY_WHEN_STAGE_CNPG_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-play-when-stage-cnpg
          key: access-key-id
      S3_USER_PLAY_WHEN_STAGE_CNPG_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-play-when-stage-cnpg
          key: secret-access-key
      S3_USER_PLAY_WHEN_PROD_CNPG_ACCESS_KEY_ID:
        secretKeyRef:
          name: seaweedfs-s3-user-play-when-prod-cnpg
          key: access-key-id
      S3_USER_PLAY_WHEN_PROD_CNPG_SECRET_ACCESS_KEY:
        secretKeyRef:
          name: seaweedfs-s3-user-play-when-prod-cnpg
          key: secret-access-key
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-identities
      createBuckets:
        - name: authelia-cnpg
        - name: lldap-cnpg
        - name: nextcloud-cnpg
        - name: play-when-dev-cnpg
        - name: play-when-stage-cnpg
        - name: play-when-prod-cnpg
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  s3:
    enableAuth: true

  admin:
    enabled: true
    allowInsecureBind: true
    nodeSelector: |
      kubernetes.io/arch: arm64
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: longhorn

  worker:
    enabled: true
    # Exclude erasure_coding (in "heavy"/"all"): it replaces replicated volumes with EC shards,
    # which can't survive losing a whole rack/zone with only 3.
    jobType: default
    nodeSelector: |
      kubernetes.io/arch: arm64

  networkPolicy:
    enabled: true
    # Allow prometheus to scrape metrics from all components (see `global.monitoring.enabled` above)
    extraIngress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-prometheus-stack
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/instance: kube-prometheus-stack-prometheus
        ports:
          - protocol: TCP
            port: metrics
    components:
      # Allow traefik to access `admin` (see `admin.httpRoute` below)
      admin:
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                    app.kubernetes.io/instance: traefik
            ports:
              - protocol: TCP
                port: admin
      filer:
        extraIngress:
          # Allow traefik to access `s3` on the `filer` (see `filer.httpRoute` below)
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                    app.kubernetes.io/instance: traefik
            ports:
              - protocol: TCP
                port: swfs-s3
          # Allow CNPG (barman-cloud plugin sidecar) to access `s3` on the `filer`
          - from:
              - namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - auth
                        - nextcloud
                        - play-when-dev
                        - play-when-stage
                        - play-when-prod
                podSelector:
                  matchExpressions:
                    - key: cnpg.io/cluster
                      operator: Exists
            ports:
              - protocol: TCP
                port: swfs-s3

admin:
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-intranet
        namespace: traefik
    filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: authelia
s3:
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-intranet
        namespace: traefik
  # S3 identities without credentials, rendered into the secret `seaweedfs-s3-identities`
  # SeaweedFS resolves the ${VAR} references from `seaweedfs.filer.secretExtraEnvironmentVars` above
  identities:
    - name: Admin
      actions:
        - Admin
      credentials:
        - accessKey: "${S3_USER_ADMIN_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_ADMIN_SECRET_ACCESS_KEY}"
    - name: ReadOnly
      actions:
        - Read
        - List
      credentials:
        - accessKey: "${S3_USER_READONLY_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_READONLY_SECRET_ACCESS_KEY}"
    - name: nextcloud-cnpg
      actions:
        - Read:nextcloud-cnpg
        - Write:nextcloud-cnpg
        - List:nextcloud-cnpg
      credentials:
        - accessKey: "${S3_USER_NEXTCLOUD_CNPG_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_NEXTCLOUD_CNPG_SECRET_ACCESS_KEY}"
    - name: authelia-cnpg
      actions:
        - Read:authelia-cnpg
        - Write:authelia-cnpg
        - List:authelia-cnpg
      credentials:
        - accessKey: "${S3_USER_AUTHELIA_CNPG_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_AUTHELIA_CNPG_SECRET_ACCESS_KEY}"
    - name: lldap-cnpg
      actions:
        - Read:lldap-cnpg
        - Write:lldap-cnpg
        - List:lldap-cnpg
      credentials:
        - accessKey: "${S3_USER_LLDAP_CNPG_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_LLDAP_CNPG_SECRET_ACCESS_KEY}"
    - name: play-when-dev-cnpg
      actions:
        - Read:play-when-dev-cnpg
        - Write:play-when-dev-cnpg
        - List:play-when-dev-cnpg
      credentials:
        - accessKey: "${S3_USER_PLAY_WHEN_DEV_CNPG_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_PLAY_WHEN_DEV_CNPG_SECRET_ACCESS_KEY}"
    - name: play-when-stage-cnpg
      actions:
        - Read:play-when-stage-cnpg
        - Write:play-when-stage-cnpg
        - List:play-when-stage-cnpg
      credentials:
        - accessKey: "${S3_USER_PLAY_WHEN_STAGE_CNPG_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_PLAY_WHEN_STAGE_CNPG_SECRET_ACCESS_KEY}"
    - name: play-when-prod-cnpg
      actions:
        - Read:play-when-prod-cnpg
        - Write:play-when-prod-cnpg
        - List:play-when-prod-cnpg
      credentials:
        - accessKey: "${S3_USER_PLAY_WHEN_PROD_CNPG_ACCESS_KEY_ID}"
          secretKey: "${S3_USER_PLAY_WHEN_PROD_CNPG_SECRET_ACCESS_KEY}"
