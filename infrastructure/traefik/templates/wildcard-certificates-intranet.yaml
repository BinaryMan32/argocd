{{- range $name, $certificate := .Values.intranet.wildcardCertificates }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
spec:
  secretName: {{ default $name $certificate.secretName }}
  issuerRef:
    kind: ClusterIssuer
    name: intranet-dns01-prod
  commonName: "*.{{ $certificate.dnsName }}"
  dnsNames:
    - "{{ $certificate.dnsName }}"
    - "*.{{ $certificate.dnsName }}"
{{- end }}
