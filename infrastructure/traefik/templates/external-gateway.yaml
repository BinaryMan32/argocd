apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-external
{{- with .Values.external.dnsTarget }}
  annotations:
    # Required: otherwise external-dns would use status.addresses, which is the intranet IP.
    external-dns.kubernetes.io/target: {{ . | quote }}
{{- end }}
spec:
  gatewayClassName: traefik
  listeners:
{{- /*
Each HTTPS listener is on the websecure-ext entrypoint for direct connections,
and on the websecure-relay entrypoint for connections through the relay VPS.
Routes attach to both, since they reference the Gateway without a sectionName.
*/}}
{{- range $name, $listener := .Values.external.gateway.listeners.https }}
{{- range $suffix, $port := dict "" 9443 "-relay" (index $.Values.traefik.ports "websecure-relay" "port") }}
    - name: {{ $name }}{{ $suffix }}
      port: {{ $port }}
      protocol: HTTPS
      hostname: {{ $listener.hostname | quote }}
      allowedRoutes:
{{- if $listener.namespace }}
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $listener.namespace }}
{{- else }}
        namespaces:
          from: Same
{{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ default (printf "%s-tls" $name) $listener.certificateRef }}
{{- end }}
{{- end }}
