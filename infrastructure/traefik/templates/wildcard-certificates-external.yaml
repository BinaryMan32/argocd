{{- range $name, $certificate := .Values.external.wildcardCertificates }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
spec:
  secretName: {{ default $name $certificate.secretName }}
  issuerRef:
    kind: ClusterIssuer
    # TODO change to prod
    name: external-dns01-staging
  dnsNames:
    {{- toYaml $certificate.dnsNames | nindent 4 }}
{{- end }}
