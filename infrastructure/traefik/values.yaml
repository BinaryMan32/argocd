dashboard:
  hostname: null
intranet:
  wildcardCertificates: {}
  gateway:
    listeners:
      http: {}
      https: {}
external:
  # override from ArgoCD App: hostname of the DNS record with the relay VPS public IP address,
  # created by hand, see infrastructure/external-dns.
  # external-dns creates a DNS-only CNAME to it for each attached HTTPRoute hostname in its domain.
  dnsTarget: ""
  gateway:
    listeners:
      https: {}
cloudflare:
  # override from ArgoCD App: <tunnel UUID>.cfargotunnel.com
  target: ""
  gateway:
    listeners:
      http: {}

# started from https://doc.traefik.io/traefik/v3.4/setup/kubernetes/
# https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
traefik:
  instanceLabelOverride: traefik

  global:
    checkNewVersion: true
    sendAnonymousUsage: true

  # Configure Network Ports and EntryPoints
  # EntryPoints are the network listeners for incoming traffic.
  ports:
    traefik:
      http:
        # Reject requests with headers that alias another header (e.g. Remote_User for Remote-User),
        # https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/#aliasheadersstrategy
        aliasHeadersStrategy: reject
    metrics:
      http:
        aliasHeadersStrategy: reject
    web:
      port: 80
      http:
        aliasHeadersStrategy: reject
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      port: 443
      http:
        aliasHeadersStrategy: reject
    websecure-ext:
      port: 9443
      exposedPort: 443
      expose:
        external: true
      http:
        aliasHeadersStrategy: reject
    web-cloudflare:
      port: 7080
      exposedPort: 80
      expose:
        default: false
        cloudflare: true
      http:
        aliasHeadersStrategy: reject
      # Keep X-Forwarded-For set by cloudflared, which contains the real client IP
      forwardedHeaders:
        trustedIPs:
          # pod CIDR
          - 10.42.0.0/16
    # HTTPS from the relay VPS, see infrastructure/relay. The relay pod forwards it to
    # the traefik-relay ClusterIP Service, and is the only pod allowed to reach this port.
    websecure-relay:
      port: 6443
      exposedPort: 6443
      expose:
        default: false
        relay: true
      http:
        aliasHeadersStrategy: reject
      # The VPS starts each connection with a PROXY protocol header containing the client IP
      proxyProtocol:
        trustedIPs:
          # pod CIDR
          - 10.42.0.0/16

  service:
    spec:
      # Preserve client IP addresses
      externalTrafficPolicy: Local
    additionalServices:
      external:
        spec:
          type: LoadBalancer
          # Preserve client IP addresses
          externalTrafficPolicy: Local
      cloudflare:
        spec:
          type: ClusterIP
      relay:
        spec:
          type: ClusterIP
          # Fixed, since the relay pod has no DNS access, see infrastructure/relay/values.yaml.
          # Kubernetes only assigns addresses in 10.43.0.0/24 when every other address is used.
          clusterIP: 10.43.0.20

  # Enables the dashboard in Secure Mode
  api:
    dashboard: true
    insecure: false
    disableDashboardAd: true

  ingressClass:
    enabled: false

  gatewayClass:
    enabled: true

  gateway:
    enabled: false

  deployment:
    replicas: 3

  # try to keep replicas in different node availability zones
  topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik
      topologyKey: topology.kubernetes.io/zone
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik
      topologyKey: kubernetes.io/hostname
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule

  # Providers controls which resources Traefik watches to find routing configuration.
  providers:
    # traefik IngressRoute
    kubernetesCRD:
      enabled: true
      # Allow middleware from one namespace to chain middleware in another namespace
      allowCrossNamespace: true
      # Use collision-safe names for generated routers, middlewares, and services
      # https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-crd/#safenaming
      safeNaming: true
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true
      statusAddress:
        service:
          # Copies the loadBalancerIP from the Traefik service to the status.address field of the Gateway resource
          # Unfortunately, this updates both the intranet and external Gateway resources to match the intranet service.
          # k8s_gateway requires this address to resolve DNS queries, but k8s_gateway should ignore non-intranet queries.
          # Track issues below for progress
          # https://github.com/traefik/traefik/issues/12076
          # https://github.com/traefik/traefik/issues/12500
          enabled: true
  log:
    level: INFO
  # This enables access logs, outputting them to Traefik's standard output by default.
  # The [Access Logs Documentation](https://doc.traefik.io/traefik/observability/access-logs/) covers formatting, filtering, and output options.
  accessLog:
    enabled: true
    format: json

  # Enables Prometheus metrics
  metrics:
    prometheus:
      service:
        enabled: true
      serviceMonitor:
        enabled: true

  tracing:
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: "tempo.tempo.svc.cluster.local:4317"
        insecure: true
