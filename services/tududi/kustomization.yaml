apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./resources/cnpg-cluster.yaml
  - ./resources/cnpg-objectstore.yaml
  - ./resources/cnpg-podmonitor.yaml
  - ./resources/cnpg-scheduled-backup.yaml
  - ./resources/deployment.yaml
  - ./resources/httproute.yaml
  - ./resources/network-policy.yaml
  - ./resources/pvc-uploads.yaml
  - ./resources/sealed-secret.yaml
  - ./resources/sealed-secret-authelia-oidc-tududi.yaml
  - ./resources/sealed-secret-seaweedfs-s3-user-tududi-cnpg.yaml
  - ./resources/service.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/instance: tududi
      app.kubernetes.io/name: tududi
images:
  - name: tududi
    newName: chrisvel/tududi
    newTag: 2.0.0
buildMetadata: [managedByLabel]
