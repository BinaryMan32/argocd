apiVersion: apps/v1
kind: Deployment
metadata:
  name: tududi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: tududi
      app.kubernetes.io/name: tududi
  template:
    spec:
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: tududi
          image: tududi
          # https://docs.tududi.com/getting-started/configuration
          env:
            # https://github.com/chrisvel/tududi/blob/main/docs/16-postgresql.md
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tududi-db-app
                  key: uri
            - name: TUDUDI_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: tududi
                  key: userEmail
            - name: TUDUDI_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tududi
                  key: userPassword
            - name: TUDUDI_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: tududi
                  key: sessionSecret
            - name: TUDUDI_ALLOWED_ORIGINS
              value: https://tududi.int.fivebytestudios.com
            # https://docs.tududi.com/getting-started/sso-oidc
            - name: BASE_URL
              value: https://tududi.int.fivebytestudios.com
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: Authelia
            # Part of the redirect URI configured in Authelia
            - name: OIDC_PROVIDER_SLUG
              value: authelia
            - name: OIDC_ISSUER_URL
              value: https://auth.int.fivebytestudios.com
            - name: PUID
              value: "65534"
            - name: PGID
              value: "65534"
          envFrom:
            - secretRef:
                name: authelia-oidc-tududi
          ports:
            - name: http
              protocol: TCP
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - mountPath: /app/uploads
              name: uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: tududi-uploads
