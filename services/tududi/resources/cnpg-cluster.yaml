apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tududi-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11

  affinity:
    topologyKey: topology.kubernetes.io/zone

  bootstrap:
    initdb:
      database: tududi
      owner: tududi

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tududi-seaweedfs
