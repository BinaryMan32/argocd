apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt
spec:
  revisionHistoryLimit: 3
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: home-assistant
      app.kubernetes.io/name: mqtt
  serviceName: mqtt
  template:
    spec:
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
      initContainers:
        - command:
            - /auth-setup/auth-setup.sh
          env:
            - name: FLASHFORGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: flashforge-password
                  name: mqtt
            - name: FLASHFORGE_USERNAME
              valueFrom:
                secretKeyRef:
                  key: flashforge-username
                  name: mqtt
            - name: HOME_ASSISTANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: home-assistant-password
                  name: mqtt
            - name: HOME_ASSISTANT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: home-assistant-username
                  name: mqtt
            - name: TASMOTA_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: tasmota-password
                  name: mqtt
            - name: TASMOTA_USERNAME
              valueFrom:
                secretKeyRef:
                  key: tasmota-username
                  name: mqtt
          image: mosquitto
          name: auth-setup
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /auth-setup
              name: init
              readOnly: true
            - mountPath: /mosquitto/auth
              name: auth
      containers:
        - image: mosquitto
          name: main
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /mosquitto/config/
              name: config
              readOnly: true
            - mountPath: /mosquitto/data
              name: data
            - mountPath: /mosquitto/auth
              name: auth
              readOnly: true
      volumes:
        - configMap:
            defaultMode: 432
            name: mqtt-config
          name: config
        - configMap:
            defaultMode: 360
            name: mqtt-init
          name: init
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: auth
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: longhorn
