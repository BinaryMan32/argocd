apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./resources/sealed-secret-mqtt.yaml
  - ./resources/service.yaml
  - ./resources/statefulset.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/instance: home-assistant
      app.kubernetes.io/name: mqtt
    # kustomize 5.8.2+ no longer labels `volumeClaimTemplates` with `includeTemplates`.
    # `includeVolumeClaimTemplates: true` restores the old behavior, but earlier versions reject it.
    fields:
      - path: spec/volumeClaimTemplates[]/metadata/labels
        group: apps
        kind: StatefulSet
        create: true
images:
  - name: mosquitto
    newName: eclipse-mosquitto
    newTag: 2.1.2-alpine
configMapGenerator:
  - name: mqtt-config
    files:
      - configmaps/config/mosquitto.conf
    options:
      disableNameSuffixHash: true
  - name: mqtt-init
    files:
      - configmaps/init/auth-setup.sh
      - configmaps/init/mosquitto_acl
    options:
      disableNameSuffixHash: true
buildMetadata: [managedByLabel]
