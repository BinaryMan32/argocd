apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./resources/cnpg-cluster.yaml
  - ./resources/cnpg-objectstore.yaml
  - ./resources/cnpg-podmonitor.yaml
  - ./resources/cnpg-scheduled-backup.yaml
  - ./resources/deployment.yaml
  - ./resources/httproute.yaml
  - ./resources/network-policy.yaml
  - ./resources/pvc-data.yaml
  - ./resources/sealed-secret.yaml
  - ./resources/sealed-secret-authelia-oidc-homebox.yaml
  - ./resources/sealed-secret-seaweedfs-s3-user-homebox-cnpg.yaml
  - ./resources/service.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/instance: homebox
      app.kubernetes.io/name: homebox
images:
  - name: homebox
    newName: ghcr.io/sysadminsmedia/homebox
    newTag: 0.27.1-rootless
buildMetadata: [managedByLabel]
