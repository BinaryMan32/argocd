apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homebox-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  affinity:
    topologyKey: topology.kubernetes.io/zone

  bootstrap:
    initdb:
      database: homebox
      owner: homebox

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: homebox-seaweedfs
