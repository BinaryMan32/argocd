apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: homebox-db-backup
spec:
  cluster:
    name: homebox-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  backupOwnerReference: self
  # Weekly, Monday 00:45
  schedule: "0 45 0 * * MON"
  # Take the first base backup right away instead of waiting for the schedule
  immediate: true
