apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: media
  namespace: argocd
  # Finalizer that ensures that project is not deleted until it is not referenced by any application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: manage and view media files
  sourceRepos:
  - {{ .Values.source.repoURL }}
  - https://jellyfin.github.io/jellyfin-helm
  - ghcr.io/seerr-team/seerr
  destinations:
  - namespace: media
    server: {{ .Values.destination.server }}
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: ''
    kind: PersistentVolume
  roles:
  - name: ops
    description: Read-only access plus sync
    policies:
    - p, proj:media:ops, applications, get, media/*, allow
    - p, proj:media:ops, applications, sync, media/*, allow
    - p, proj:media:ops, applicationsets, get, media/*, allow
    - p, proj:media:ops, logs, get, media/*, allow
