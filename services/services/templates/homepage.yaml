apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.source.repoURL }}
    targetRevision: {{ .Values.source.targetRevision }}
    path: "{{ .Values.project.path }}/homepage"
    helm:
      valuesObject:
        httpRoute:
          hostname: homepage.{{ .Values.domain.intranet }}
        homepage:
          # https://github.com/jameswynn/helm-charts/blob/main/charts/homepage/values.yaml
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.{{ .Values.domain.intranet }}
          config:
            services:
              # icons from https://gethomepage.dev/configs/services/#icons
              - Productivity:
                - External:
                  - NextCloud:
                      icon: nextcloud.png
                      href: "https://nextcloud.{{ .Values.domain.external }}/"
                      description: Private Cloud
                      namespace: nextcloud
                      app: nextcloud
                - Home Assistant:
                    icon: home-assistant.png
                    href: "https://home-assistant.{{ .Values.domain.intranet }}/"
                    description: Home Automation
                    namespace: home-assistant
                    app: home-assistant
                - Homebox:
                    icon: homebox.png
                    href: "https://homebox.{{ .Values.domain.intranet }}/"
                    description: Home Inventory
                    namespace: homebox
                    app: homebox
                - Tandoor Recipes:
                    icon: tandoor-recipes.png
                    href: "https://tandoor.{{ .Values.domain.intranet }}/"
                    description: Recipe Manager
                    namespace: tandoor-recipes
                    app: tandoor-recipes
                - Tududi:
                    icon: tududi-dark.png
                    href: "https://tududi.{{ .Values.domain.intranet }}/"
                    description: Task Management
                    namespace: tududi
                    app: tududi
                - Games:
                  - External:
                    - Foundry VTT (Fred):
                        icon: foundry-vtt.png
                        href: "https://fred.foundry-vtt.{{ .Values.domain.external }}/"
                        description: Virtual Tabletop
                        namespace: foundry-vtt
                        app: foundry-vtt
                        podSelector: >-
                          app.kubernetes.io/name=foundry-vtt,
                          app.kubernetes.io/instance=fred
                    - Foundry VTT (Allen):
                        icon: foundry-vtt.png
                        href: "https://allen.foundry-vtt.{{ .Values.domain.external }}/"
                        description: Virtual Tabletop
                        namespace: foundry-vtt
                        app: foundry-vtt
                        podSelector: >-
                          app.kubernetes.io/name=foundry-vtt,
                          app.kubernetes.io/instance=allen
              - Media:
                - External:
                  - Navidrome:
                      icon: navidrome.png
                      href: "https://navidrome.{{ .Values.domain.external }}/"
                      description: Music Player
                      namespace: media
                      app: navidrome
                  - Jellyfin:
                      icon: jellyfin.png
                      href: "https://jellyfin.{{ .Values.domain.external }}/"
                      description: Media Server
                      namespace: media
                      app: jellyfin
                - Audiobookshelf:
                    icon: audiobookshelf.png
                    href: "https://audiobookshelf.{{ .Values.domain.intranet }}/"
                    description: Audio Book Player
                    namespace: media
                    app: audiobookshelf
                - QBittorrent:
                    icon: qbittorrent.png
                    href: "https://qbittorrent.{{ .Values.domain.intranet }}/"
                    description: Torrent Downloader
                    namespace: media
                    app: qbittorrent
                    widget:
                      # https://gethomepage.dev/widgets/services/qbittorrent/
                      type: qbittorrent
                      url: http://qbittorrent.media
                      fields: ["leech", "download", "seed", "upload"]
                      enableLeechProgress: true
                # sidecar in the qbittorrent pod, which the QBittorrent card already shows
                - Gluetun:
                    icon: gluetun.png
                    description: VPN for qBittorrent and friends
                    widget:
                      # https://gethomepage.dev/widgets/services/gluetun/
                      type: gluetun
                      url: http://gluetun.media
                      version: 2
                      fields: ["public_ip", "region", "country", "port_forwarded"]
                      highlight:
                        # 0 when no port is forwarded
                        port_forwarded:
                          numeric:
                            - level: danger
                              when: eq
                              value: 0
                - Bazarr:
                    icon: bazarr.png
                    href: "https://bazarr.{{ .Values.domain.intranet }}/"
                    description: Subtitle Manager
                    namespace: media
                    app: bazarr
                - Prowlarr:
                    icon: prowlarr.png
                    href: "https://prowlarr.{{ .Values.domain.intranet }}/"
                    description: Indexing Manager
                    namespace: media
                    app: prowlarr
                - Radarr:
                    icon: radarr.png
                    href: "https://radarr.{{ .Values.domain.intranet }}/"
                    description: Movie Manager
                    namespace: media
                    app: radarr
                    widget:
                      # no field in the radarr widget flags failed imports, so query the queue status
                      # https://gethomepage.dev/widgets/services/customapi/
                      type: customapi
                      url: http://radarr.media/api/v3/queue/status
                      headers:
                        X-Api-Key: "{{`{{HOMEPAGE_VAR_RADARR_KEY}}`}}"
                      mappings: &queueStatusMappings
                        # completed downloads stay in the queue when import fails
                        - label: Queued
                          field: totalCount
                          format: number
                        # flags, not counts; false renders blank unless remapped
                        - label: Warnings
                          field: warnings
                          remap:
                            - value: false
                              to: "✅"
                            - value: true
                              to: "⚠️"
                        - label: Errors
                          field: errors
                          remap:
                            - value: false
                              to: "✅"
                            - value: true
                              to: "❌"
                      # matches the remapped values above
                      highlight: &queueStatusHighlight
                        Warnings:
                          string:
                            - level: warn
                              when: equals
                              value: "⚠️"
                        Errors:
                          string:
                            - level: danger
                              when: equals
                              value: "❌"
                - Seerr:
                    icon: seerr.png
                    href: "https://seerr.{{ .Values.domain.intranet }}/"
                    description: Request Manager
                    namespace: media
                    app: seerr
                - Sonarr:
                    icon: sonarr.png
                    href: "https://sonarr.{{ .Values.domain.intranet }}/"
                    description: TV Manager
                    namespace: media
                    app: sonarr
                    widget:
                      # same as radarr
                      type: customapi
                      url: http://sonarr.media/api/v3/queue/status
                      headers:
                        X-Api-Key: "{{`{{HOMEPAGE_VAR_SONARR_KEY}}`}}"
                      mappings: *queueStatusMappings
                      highlight: *queueStatusHighlight
                - Tdarr:
                    icon: tdarr.png
                    href: "https://tdarr.{{ .Values.domain.intranet }}/"
                    description: Media Transcoding
                    namespace: media
                    app: tdarr
                    # node pods share the name label and may be scaled to zero
                    podSelector: >-
                      app.kubernetes.io/name=tdarr,
                      app.kubernetes.io/component=server
                    widget:
                      # https://gethomepage.dev/widgets/services/tdarr/
                      type: tdarr
                      url: http://tdarr.media
                      key: "{{`{{HOMEPAGE_VAR_TDARR_KEY}}`}}"
                      # processed and saved are lifetime totals, not health
                      fields: ["queue", "errored"]
                      highlight:
                        # transcode and health check errors stay until requeued
                        errored:
                          numeric:
                            - level: danger
                              when: gt
                              value: 0
              - Infrastructure:
                - ArgoCD:
                    icon: argo-cd.png
                    href: "https://argocd.{{ .Values.domain.intranet }}/"
                    description: Continuous Deployment
                    namespace: argocd
                    app: argocd-server
                    widget:
                      # https://gethomepage.dev/widgets/services/argocd/
                      type: argocd
                      url: http://argocd-server.argocd
                      key: "{{`{{HOMEPAGE_VAR_ARGOCD_KEY}}`}}"
                      # only statuses that should be 0, max 4 fields
                      fields: ["degraded", "progressing", "outOfSync", "missing"]
                      highlight:
                        degraded:
                          numeric:
                            - level: danger
                              when: gt
                              value: 0
                        progressing:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                        outOfSync:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                        missing:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                    podSelector: >-
                      app.kubernetes.io/name in (
                        argocd-server,
                        argocd-repo-server,
                        argocd-dex-server
                      )
                - Headlamp:
                    icon: headlamp.png
                    href: "https://headlamp.{{ .Values.domain.intranet }}/"
                    description: Kubernetes cluster analysis and management
                    namespace: headlamp
                    app: headlamp
                - Longhorn:
                    icon: longhorn.png
                    href: "https://longhorn.{{ .Values.domain.intranet }}/"
                    description: Distributed Kubernetes Volumes
                    namespace: longhorn-system
                    app: longhorn
                    # select all pods in namespace
                    pod-selector: ""
                - Pihole:
                    icon: pi-hole.png
                    href: "https://pihole.{{ .Values.domain.intranet }}/admin"
                    description: DNS Blocker
                    namespace: pihole
                    app: pihole
                    widget:
                      # https://gethomepage.dev/widgets/services/pihole/
                      type: pihole
                      url: http://pihole-web.pihole
                      version: 6
                      key: "{{`{{HOMEPAGE_VAR_PIHOLE_KEY}}`}}"
                - SeaweedFS:
                    icon: files-community.png
                    href: "https://seaweedfs-admin.{{ .Values.domain.intranet }}/"
                    description: S3 Compatible Object Storage
                    namespace: seaweedfs
                    app: seaweedfs
                # separate from the SeaweedFS card, since widget values can't link and the card href is the admin UI
                - SeaweedFS Grafana Dashboard:
                    icon: grafana.png
                    # dashboard from the seaweedfs chart, enabled by `global.monitoring.enabled`
                    href: "https://grafana.{{ .Values.domain.intranet }}/d/a24009d7-cbda-4443-a132-1cc1c4677304/seaweedfs"
                    description: SeaweedFS Health
                    widget:
                      # no seaweedfs widget, so query health from prometheus
                      # https://gethomepage.dev/widgets/services/prometheusmetric/
                      type: prometheusmetric
                      url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack:9090
                      metrics:
                        - label: Under-replicated
                          query: sum(SeaweedFS_master_under_replicated_volumes) + sum(SeaweedFS_master_replica_placement_mismatch)
                        - label: Disk Errors
                          query: >-
                            sum(SeaweedFS_volumeServer_disk_error_status)
                            + sum(SeaweedFS_volumeServer_io_quarantine)
                            + sum(SeaweedFS_volumeServer_read_only_volumes)
                        # each volume holds up to volumeSizeLimitMB, so slots run out before disk space
                        - label: Volume Slots
                          query: 100 * sum(SeaweedFS_volumeServer_volumes) / sum(SeaweedFS_volumeServer_max_volumes)
                          format:
                            type: percent
                        # 4xx excluded, clients occasionally get 403
                        - label: S3 5xx
                          query: sum(increase(SeaweedFS_s3_request_total{code=~"5.."}[24h])) or vector(0)
                          # increase() extrapolates, so round off fractional counts
                          format:
                            type: number
                            options:
                              maximumFractionDigits: 0
                      # keyed by metric label, first matching rule wins
                      # https://gethomepage.dev/configs/services/#block-highlighting
                      highlight:
                        # 020 placement keeps 3 copies, so one missing copy is a warning
                        Under-replicated:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                        Disk Errors:
                          numeric:
                            - level: danger
                              when: gt
                              value: 0
                        Volume Slots:
                          numeric:
                            - level: danger
                              when: gte
                              value: 90
                            - level: warn
                              when: gte
                              value: 75
                        S3 5xx:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                - Traefik:
                    icon: traefik.png
                    href: "https://traefik.{{ .Values.domain.intranet }}/"
                    description: Gateway Admin Dashboard
                    namespace: traefik
                    app: traefik
                - TrueNAS:
                    icon: truenas.png
                    href: https://192.168.0.8/
                    description: ZFS Storage and Shared Volumes
                    widget:
                      # https://gethomepage.dev/widgets/services/truenas/
                      type: truenas
                      url: https://192.168.8.9
                      key: "{{`{{HOMEPAGE_VAR_TRUENAS_KEY}}`}}"
                      version: 2
                      fields: ["load", "alerts"]
                      enablePools: true
                      highlight:
                        alerts:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                - TrueNAS BMC:
                    icon: asrock-rack.png
                    href: https://192.168.0.7/
                    description: Remote Management
              - Monitoring:
                - Prometheus:
                    icon: prometheus.png
                    href: "https://prometheus.{{ .Values.domain.intranet }}/"
                    description: Metric Collection
                    namespace: kube-prometheus-stack
                    app: prometheus
                    widget:
                      # https://gethomepage.dev/widgets/services/prometheus/
                      type: prometheus
                      url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack:9090
                      highlight:
                        targets_down:
                          numeric:
                            - level: danger
                              when: gt
                              value: 0
                    podSelector: >-
                      app.kubernetes.io/name in (
                        prometheus-node-exporter,
                        kube-state-metrics,
                        prometheus
                      )
                - Grafana:
                    icon: grafana.png
                    href: "https://grafana.{{ .Values.domain.intranet }}/"
                    description: Visualization
                    namespace: kube-prometheus-stack
                    app: grafana
                    pod-selector: >-
                      app.kubernetes.io/name in (
                        grafana
                      )
                - Alert Manager:
                    icon: alertmanager.png
                    href: "https://alertmanager.{{ .Values.domain.intranet }}/"
                    description: Alerts
                    namespace: kube-prometheus-stack
                    app: alertmanager
                    widget:
                      # no alertmanager widget, so query firing alerts from prometheus
                      # https://gethomepage.dev/widgets/services/prometheusmetric/
                      type: prometheusmetric
                      url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack:9090
                      metrics:
                        # severity filters exclude the always-firing Watchdog and InfoInhibitor
                        - label: Critical
                          query: count(ALERTS{alertstate="firing",severity="critical"}) or vector(0)
                        - label: Warning
                          query: count(ALERTS{alertstate="firing",severity="warning"}) or vector(0)
                        - label: Pending
                          query: count(ALERTS{alertstate="pending",severity=~"critical|warning"}) or vector(0)
                      highlight:
                        Critical:
                          numeric:
                            - level: danger
                              when: gt
                              value: 0
                        Warning:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                        Pending:
                          numeric:
                            - level: warn
                              when: gt
                              value: 0
                    pod-selector: >-
                      app.kubernetes.io/name in (
                        alertmanager
                      )
                - Jaeger:
                    icon: jaeger.png
                    href: "https://jaeger.{{ .Values.domain.intranet }}/"
                    description: Tracing
                    namespace: jaeger
                    app: jaeger
  destination:
    namespace: homepage
    server: {{ .Values.destination.server }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
