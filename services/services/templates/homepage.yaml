apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.source.repoURL }}
    targetRevision: {{ .Values.source.targetRevision }}
    path: "{{ .Values.project.path }}/homepage"
    kustomize:
      patches:
        - target:
            kind: Deployment
            name: homepage
          patch: |-
            - op: add
              path: /spec/template/spec/containers/0/env/-
              value:
                name: HOMEPAGE_ALLOWED_HOSTS
                value: homepage.{{ .Values.domain.intranet }}
            - op: add
              path: /spec/template/spec/containers/0/env/-
              value:
                name: HOMEPAGE_VAR_DOMAIN_INTRANET
                value: {{ .Values.domain.intranet }}
            - op: add
              path: /spec/template/spec/containers/0/env/-
              value:
                name: HOMEPAGE_VAR_DOMAIN_EXTERNAL
                value: {{ .Values.domain.external }}
        - target:
            kind: HTTPRoute
            name: homepage
          patch: |-
            - op: replace
              path: /spec/hostnames/0
              value: homepage.{{ .Values.domain.intranet }}
  destination:
    namespace: homepage
    server: {{ .Values.destination.server }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
