apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project.name }}
  namespace: argocd
  # Finalizer that ensures that project is not deleted until it is not referenced by any application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Services
  sourceRepos:
  - {{ .Values.source.repoURL }}
  - https://jameswynn.github.io/helm-charts/ # homepage
  - https://pajikos.github.io/home-assistant-helm-chart/
  destinations:
  - namespace: '*'
    server: {{ .Values.destination.server }}
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: ''
    kind: PersistentVolume
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  roles:
  - name: ops
    description: Read-only access plus sync
    policies:
    - p, proj:{{ .Values.project.name }}:ops, applications, get, {{ .Values.project.name }}/*, allow
    - p, proj:{{ .Values.project.name }}:ops, applications, sync, {{ .Values.project.name }}/*, allow
    - p, proj:{{ .Values.project.name }}:ops, applicationsets, get, {{ .Values.project.name }}/*, allow
    - p, proj:{{ .Values.project.name }}:ops, logs, get, {{ .Values.project.name }}/*, allow
