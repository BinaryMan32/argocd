apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./resources/cluster-role-binding-homepage.yaml
  - ./resources/cluster-role-homepage.yaml
  - ./resources/deployment.yaml
  - ./resources/httproute.yaml
  - ./resources/sealed-secret-homepage-argocd.yaml
  - ./resources/sealed-secret-homepage-pihole.yaml
  - ./resources/sealed-secret-homepage-radarr.yaml
  - ./resources/sealed-secret-homepage-sonarr.yaml
  - ./resources/sealed-secret-homepage-tdarr.yaml
  - ./resources/sealed-secret-homepage-truenas.yaml
  - ./resources/service-account.yaml
  - ./resources/service.yaml
configMapGenerator:
  # https://gethomepage.dev/configs/
  # mounted read-only, so must include every file homepage would otherwise
  # copy from src/skeleton, or it exits on startup
  - name: homepage
    files:
      - config/bookmarks.yaml
      - config/custom.css
      - config/custom.js
      - config/docker.yaml
      - config/kubernetes.yaml
      - config/proxmox.yaml
      - config/services.yaml
      - config/settings.yaml
      - config/widgets.yaml
    options:
      disableNameSuffixHash: true
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/instance: homepage
      app.kubernetes.io/name: homepage
images:
  - name: homepage
    newName: ghcr.io/gethomepage/homepage
    newTag: v2.8.0
buildMetadata: [managedByLabel]
