      description: Audible Audio Book Downloader
      namespace: media
      app: libation
      podSelector: >-
        app.kubernetes.io/name=libation,
        app.kubernetes.io/component=ui
  - Libation ArgoCD:
      icon: argo-cd.png
      href: "https://argocd.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/applications/argocd/libation?resource=kind%3ACronJob%2Ckind%3ADeployment%2Ckind%3APod"
      description: Scale the UI deployment or trigger the cronjob
  - QBittorrent:
      icon: qbittorrent.png
      href: "https://qbittorrent.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Torrent Downloader
      namespace: media
      app: qbittorrent
      widget:
        # https://gethomepage.dev/widgets/services/qbittorrent/
        type: qbittorrent
        url: http://qbittorrent.media
        fields: ["leech", "download", "seed", "upload"]
        enableLeechProgress: true
  # sidecar in the qbittorrent pod, which the QBittorrent card already shows
  - Gluetun:
      icon: gluetun.png
      description: VPN for qBittorrent and friends
      widget:
        # https://gethomepage.dev/widgets/services/gluetun/
        type: gluetun
        url: http://gluetun.media
        version: 2
        fields: ["public_ip", "region", "country", "port_forwarded"]
        highlight:
          # 0 when no port is forwarded
          port_forwarded:
            numeric:
              - level: danger
                when: eq
                value: 0
  - Bazarr:
      icon: bazarr.png
      href: "https://bazarr.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Subtitle Manager
      namespace: media
      app: bazarr
  - Prowlarr:
      icon: prowlarr.png
      href: "https://prowlarr.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Indexing Manager
      namespace: media
      app: prowlarr
  - Radarr:
      icon: radarr.png
      href: "https://radarr.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Movie Manager
      namespace: media
      app: radarr
      widget:
        # no field in the radarr widget flags failed imports, so query the queue status
        # https://gethomepage.dev/widgets/services/customapi/
        type: customapi
        url: http://radarr.media/api/v3/queue/status
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        mappings: &queueStatusMappings
          # completed downloads stay in the queue when import fails
          - label: Queued
            field: totalCount
            format: number
          # flags, not counts; false renders blank unless remapped
          - label: Warnings
            field: warnings
            remap:
              - value: false
                to: "✅"
              - value: true
                to: "⚠️"
          - label: Errors
            field: errors
            remap:
              - value: false
                to: "✅"
              - value: true
                to: "❌"
        # matches the remapped values above
        highlight: &queueStatusHighlight
          Warnings:
            string:
              - level: warn
                when: equals
                value: "⚠️"
          Errors:
            string:
              - level: danger
                when: equals
                value: "❌"
  - Seerr:
      icon: seerr.png
      href: "https://seerr.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Request Manager
      namespace: media
      app: seerr
  - Sonarr:
      icon: sonarr.png
      href: "https://sonarr.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: TV Manager
      namespace: media
      app: sonarr
      widget:
        # same as radarr
        type: customapi
        url: http://sonarr.media/api/v3/queue/status
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        mappings: *queueStatusMappings
        highlight: *queueStatusHighlight
  - Tdarr:
      icon: tdarr.png
      href: "https://tdarr.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Media Transcoding
      namespace: media
      app: tdarr
      # node pods share the name label and may be scaled to zero
      podSelector: >-
        app.kubernetes.io/name=tdarr,
        app.kubernetes.io/component=server
      widget:
        # https://gethomepage.dev/widgets/services/tdarr/
        type: tdarr
        url: http://tdarr.media
        key: "{{HOMEPAGE_VAR_TDARR_KEY}}"
        # processed and saved are lifetime totals, not health
        fields: ["queue", "errored"]
        highlight:
          # transcode and health check errors stay until requeued
          errored:
            numeric:
              - level: danger
                when: gt
                value: 0
- Infrastructure:
  - ArgoCD:
      icon: argo-cd.png
      href: "https://argocd.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Continuous Deployment
      namespace: argocd
      app: argocd-server
      widget:
        # https://gethomepage.dev/widgets/services/argocd/
        type: argocd
        url: http://argocd-server.argocd
        key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"
        # only statuses that should be 0, max 4 fields
        fields: ["degraded", "progressing", "outOfSync", "missing"]
        highlight:
          degraded:
            numeric:
              - level: danger
                when: gt
                value: 0
          progressing:
            numeric:
              - level: warn
                when: gt
                value: 0
          outOfSync:
            numeric:
              - level: warn
                when: gt
                value: 0
          missing:
            numeric:
              - level: warn
                when: gt
                value: 0
      podSelector: >-
        app.kubernetes.io/name in (
          argocd-server,
          argocd-repo-server,
          argocd-dex-server
        )
