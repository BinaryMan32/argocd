- Monitoring:
  - Prometheus:
      icon: prometheus.png
      href: "https://prometheus.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Metric Collection
      namespace: kube-prometheus-stack
      app: prometheus
      widget:
        # https://gethomepage.dev/widgets/services/prometheus/
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack:9090
        highlight:
          targets_down:
            numeric:
              - level: danger
                when: gt
                value: 0
      podSelector: >-
        app.kubernetes.io/name in (
          prometheus-node-exporter,
          kube-state-metrics,
          prometheus
        )
  - Grafana:
      icon: grafana.png
      href: "https://grafana.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Visualization
      namespace: kube-prometheus-stack
      app: grafana
      pod-selector: >-
        app.kubernetes.io/name in (
          grafana
        )
  - Alert Manager:
      icon: alertmanager.png
      href: "https://alertmanager.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Alerts
      namespace: kube-prometheus-stack
      app: alertmanager
      widget:
        # no alertmanager widget, so query firing alerts from prometheus
        # https://gethomepage.dev/widgets/services/prometheusmetric/
        type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack:9090
        metrics:
          # severity filters exclude the always-firing Watchdog and InfoInhibitor
          - label: Critical
            query: count(ALERTS{alertstate="firing",severity="critical"}) or vector(0)
          - label: Warning
            query: count(ALERTS{alertstate="firing",severity="warning"}) or vector(0)
          - label: Pending
            query: count(ALERTS{alertstate="pending",severity=~"critical|warning"}) or vector(0)
        highlight:
          Critical:
            numeric:
              - level: danger
                when: gt
                value: 0
          Warning:
            numeric:
              - level: warn
                when: gt
                value: 0
          Pending:
            numeric:
              - level: warn
                when: gt
                value: 0
      pod-selector: >-
        app.kubernetes.io/name in (
          alertmanager
        )
  - Jaeger:
      icon: jaeger.png
      href: "https://jaeger.{{HOMEPAGE_VAR_DOMAIN_INTRANET}}/"
      description: Tracing
      namespace: jaeger
      app: jaeger
