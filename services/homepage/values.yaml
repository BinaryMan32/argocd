httpRoute:
  hostname: null
# mounted as /app/config/custom.css by homepage.persistence.custom-css
# https://gethomepage.dev/configs/custom-css-js/
customCss: |
  /* Line up kubernetes and longhorn info widget nodes in columns.
     Both use the same icon and margins, so only content width and the
     kubernetes node's ml-4 differ. The longhorn class is misspelled upstream. */
  .information-widget-kubernetes .min-w-\[85px\],
  .infomation-widget-longhorn .min-w-\[85px\] {
    width: 6rem;
  }
  .infomation-widget-longhorn > div > div {
    margin-left: 1rem;
  }
  /* longhorn appends total last; show it first like the kubernetes cluster */
  .infomation-widget-longhorn > div > div:last-child {
    order: -1;
  }
  /* Scroll qbittorrent leech progress rows after 5. Rows are siblings of the
     title and counts with no wrapper, so the whole card scrolls and the title
     and counts are pinned on top. Heights are estimates, tune if misaligned. */
  li.service[data-name="QBittorrent"] .service-card {
    --qbt-title-height: 3.25rem;
    --qbt-counts-height: 3rem;
    /* opaque copy of the dark theme card background (white/5 over page) */
    --qbt-card-bg: linear-gradient(rgb(255 255 255 / 0.05), rgb(255 255 255 / 0.05)), rgb(var(--bg-color));
    /* 5 rows are 20px each with 4px collapsed margins around them = 124px,
       plus the card's 0.25rem top and bottom padding */
    max-height: calc(var(--qbt-title-height) + var(--qbt-counts-height) + 124px + 0.5rem);
    overflow-y: auto;
  }
  li.service[data-name="QBittorrent"] .service-card:hover {
    --qbt-card-bg: linear-gradient(rgb(255 255 255 / 0.1), rgb(255 255 255 / 0.1)), rgb(var(--bg-color));
  }
  /* above row text (z-10) */
  li.service[data-name="QBittorrent"] .service-title,
  li.service[data-name="QBittorrent"] .service-container {
    position: sticky;
    z-index: 20;
    background: var(--qbt-card-bg);
  }
  li.service[data-name="QBittorrent"] .service-title {
    top: 0;
  }
  li.service[data-name="QBittorrent"] .service-container {
    top: var(--qbt-title-height);
  }
  /* keep the status badge above the pinned title */
  li.service[data-name="QBittorrent"] .service-tags {
    z-index: 30;
  }
homepage:
  # https://github.com/jameswynn/helm-charts/blob/main/charts/homepage/values.yaml
  image:
    repository: ghcr.io/gethomepage/homepage
    # https://github.com/gethomepage/homepage/tags
    # renovate: image=ghcr.io/gethomepage/homepage
    tag: v2.6.0
  enableRbac: true
  serviceAccount:
    create: true
  # secrets referenced in config as {{HOMEPAGE_VAR_*}}
  # https://gethomepage.dev/installation/docker/#using-environment-secrets
  envFrom:
    - secretRef:
        name: homepage-argocd
    - secretRef:
        name: homepage-pihole
  persistence:
    custom-css:
      enabled: true
      type: configMap
      name: homepage-custom-css
      mountPath: /app/config/custom.css
      subPath: custom.css
      readOnly: true
  config:
    settings:
      title: Five Byte Studios
      theme: dark
      color: slate
      providers:
        longhorn:
          url: http://longhorn-frontend.longhorn-system.svc.cluster.local
    widgets:
      - kubernetes:
          cluster:
            # Shows cluster-wide statistics with hardcoded label "cluster"
            show: true
            cpu: true
            memory: true
            showLabel: true
            label: "cluster"
          nodes:
            # Shows node-specific statistics with node name label
            show: true
            cpu: true
            memory: true
            showLabel: true
      # https://gethomepage.dev/widgets/info/longhorn/
      - longhorn:
          expanded: true
          total: true
          labels: true
          nodes: true
    kubernetes:
      mode: cluster
    bookmarks:
      - Developer:
        - Github:
          - icon: github-light.png
            href: https://github.com/BinaryMan32/argocd
            description: ArgoCD Applications, Configuration, and Documentation
      - Infrastructure:
        - Mercury TrueNAS (LAN):
          - icon: truenas.png
            href: https://192.168.0.8/
            description: ZFS Storage and Shared Volumes
        - Turing Pi griffin-turing0:
          - icon: rackula-dark.png
            href: https://192.168.8.10/
            description: "griffin0, griffin1, griffin2, griffin3"
        - Turing Pi griffin-turing1:
          - icon: rackula-dark.png
            href: https://192.168.8.11/
            description: "griffin4, griffin5, griffin6"
        - Turing Pi griffin-turing2:
          - icon: rackula-dark.png
            href: https://192.168.8.12/
            description: "griffin7, griffin8, griffin9"
