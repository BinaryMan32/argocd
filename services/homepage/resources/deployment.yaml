apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: homepage
      app.kubernetes.io/name: homepage
  template:
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
        - name: homepage
          image: homepage
          # services/services/templates/homepage.yaml appends HOMEPAGE_ALLOWED_HOSTS
          # and the HOMEPAGE_VAR_DOMAIN_* suffixes used in config/services.yaml
          env:
            # /app/config is read-only, so don't write logs/homepage.log there
            - name: LOG_TARGETS
              value: stdout
          # secrets referenced in config as {{HOMEPAGE_VAR_*}}
          # https://gethomepage.dev/installation/docker/#using-environment-secrets
          envFrom:
            - secretRef:
                name: homepage-argocd
            - secretRef:
                name: homepage-pihole
            - secretRef:
                name: homepage-radarr
            - secretRef:
                name: homepage-sonarr
            - secretRef:
                name: homepage-tdarr
            - secretRef:
                name: homepage-truenas
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            # mounted as a directory (not subPath) so config changes are picked up
            # without restarting, and open pages reload when /api/hash changes
            - name: homepage-config
              mountPath: /app/config
              readOnly: true
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
