nextcloud:
  # https://github.com/nextcloud/helm/blob/main/charts/nextcloud/values.yaml
  # use nginx to serve files instead of apache
  image:
    flavor: fpm-alpine
    # pin digest: 35.0.2-fpm-alpine was republished with a newer php version
    tag: 35.0.2-fpm-alpine@sha256:850e53384c892cc865483d63de0d0eae9a9f16c4e0af3ef4e8f634bbcded4641
  nginx:
    enabled: true
    image:
      repository: library/nginx
      tag: 1.31.8-alpine
  nextcloud:
    configs:
      protocol.config.php: |-
        <?php
        $CONFIG = array (
          'overwriteprotocol' => 'https'
        );
      # workaround for failed matrics scraping
      # from https://github.com/nextcloud/helm/issues/833
      trusted_domains.config.php: |-
        <?php
        $CONFIG = array (
          'trusted_domains' => array(
            0 => 'localhost',
            1 => 'nextcloud.nextcloud.svc.cluster.local',
            2 => getenv('POD_IP'),
            3 => 'nextcloud.wildfreddy.fivebytestudios.com',
          ),
        );
    extraEnv:
    - name: "POD_IP"
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    # Use client IP from X-Forwarded-For set by traefik, so brute force
    # protection and logs don't see every request coming from traefik pods.
    # Read by reverse-proxy.config.php, value is the cluster pod CIDR.
    # https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/reverse_proxy_configuration.html
    - name: "TRUSTED_PROXIES"
      value: "10.42.0.0/16"
    existingSecret:
      enabled: true
      secretName: nextcloud-admin
      usernameKey: username
      passwordKey: password
  internalDatabase:
    enabled: false
  externalDatabase:
    enabled: true
    type: postgresql
    existingSecret:
      enabled: true
      secretName: nextcloud-db-app
      usernameKey: username
      passwordKey: password
      hostKey: host
      databaseKey: dbname
  cronjob:
    enabled: true
    type: sidecar
    cronjob:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            # Run cronjob on same node as nextcloud app
            - labelSelector:
                matchExpressions:
                - key: "app.kubernetes.io/name"
                  operator: In
                  values:
                  - nextcloud
                - key: "app.kubernetes.io/instance"
                  operator: In
                  values:
                  - nextcloud
                - key: "app.kubernetes.io/component"
                  operator: In
                  values:
                  - app
              topologyKey: "kubernetes.io/hostname"
  persistence:
    enabled: true
    storageClass: longhorn
    nextcloudData:
      enabled: true
      storageClass: nfs-mercury-griffin-retain
  startupProbe:
    enabled: true
  metrics:
    enabled: true
  prometheus:
    serviceMonitor:
      enabled: true
    rules:
      enabled: true
