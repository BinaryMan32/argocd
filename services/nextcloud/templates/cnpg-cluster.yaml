apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  affinity:
    topologyKey: topology.kubernetes.io/zone

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      # Nextcloud revokes all privileges on its database from PUBLIC, including CONNECT for
      # cnpg_metrics_exporter. Grant via pg_monitor, since cnpg_metrics_exporter doesn't exist yet.
      # Only runs on bootstrap; existing clusters need the GRANT run manually.
      postInitApplicationSQL:
        - GRANT CONNECT ON DATABASE nextcloud TO pg_monitor

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nextcloud-seaweedfs
