apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  strategy:
    # https://github.com/jellyfin/jellyfin-helm/blob/master/charts/jellyfin/values.yaml
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: jellyfin
      app.kubernetes.io/name: jellyfin
  template:
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          # avoid competing with tdarr transcodes for cpu
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: node
                    app.kubernetes.io/instance: tdarr
                    app.kubernetes.io/name: tdarr
                topologyKey: kubernetes.io/hostname
      containers:
        - name: jellyfin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: jellyfin
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: http
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            # cpu request gives live transcodes priority over tdarr nodes
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              # Rockchip Media Process Platform hardware transcoding
              devic.es/rkmpp: "1"
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media
              name: media
              readOnly: false
            - mountPath: /cache
              name: cache
            - mountPath: /cache/images
              name: cache-images
            - mountPath: /cache/transcodes
              name: cache-transcodes
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: cache
          emptyDir: {}
        - name: cache-images
          persistentVolumeClaim:
            claimName: jellyfin-cache-images
        - emptyDir:
            sizeLimit: 50Gi
          name: cache-transcodes
