apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources/deployment.yaml
  - resources/httproute.yaml
  - resources/httproute-intranet.yaml
  - resources/network-policy.yaml
  - resources/pv-media.yaml
  - resources/pvc-cache-images.yaml
  - resources/pvc-config.yaml
  - resources/pvc-media.yaml
  - resources/service.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/instance: jellyfin
      app.kubernetes.io/name: jellyfin
images:
  - name: jellyfin
    newName: docker.io/jellyfin/jellyfin
    newTag: "12.4"
  # same Debian release as the jellyfin image
  - name: gcc
    newName: docker.io/library/gcc
    newTag: 16.2.0-trixie
configMapGenerator:
  - name: jellyfin-fake-device-tree
    files:
      - configmap/fake-device-tree/fake-dt.c
      - configmap/fake-device-tree/ffmpeg
      - configmap/fake-device-tree/setup.sh
    options:
      disableNameSuffixHash: true
buildMetadata: [managedByLabel]
