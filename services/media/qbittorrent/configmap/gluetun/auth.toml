# https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/control-server.md
[[roles]]
name = "healthcheck"
auth = "none"
routes = ["GET /v1/publicip/ip", "GET /v1/openvpn/status", "GET /v1/dns/status"]

# homepage gluetun widget
# https://gethomepage.dev/widgets/services/gluetun/
[[roles]]
name = "homepage"
auth = "none"
routes = ["GET /v1/publicip/ip", "GET /v1/portforward"]
