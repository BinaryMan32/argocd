apiVersion: batch/v1
kind: CronJob
metadata:
  name: libation
  labels:
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 4 * * *" # 04:00 daily
  timeZone: "America/Chicago"
  # the config volume is ReadWriteOncePod, so a run waits while the UI is scaled up,
  # and later runs are skipped until it finishes
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # 1 retry is up to 2 total attempts, scan or liberate may fail on transient network errors
      backoffLimit: 1
      # wait up to 6h for the UI to exit, allowing the config volume to mount
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cronjob
          annotations:
            kubectl.kubernetes.io/default-container: libation
        spec:
          enableServiceLinks: false
          serviceAccountName: default
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            # owner of the config and books written by the UI (PUID/PGID)
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
          # init containers run in order, so the scan only starts after libation succeeds
          initContainers:
            - name: libation
              image: libation-cli
              # https://getlibation.com/docs/installation/docker
              # liberate.sh copies Settings.json and AccountsSettings.json into /config-internal,
              # links the database, then runs the given command instead of its scan and liberate loop
              args: [/bin/bash, /scripts/liberate-watchdog.sh]
              env:
                # same path as the UI, so the log path in Settings.json stays valid
                - name: LIBATION_CONFIG_DIR
                  value: /config/Libation
                # replaces Books in the copied Settings.json, same path as the UI
                - name: LIBATION_BOOKS_DIR
                  value: /mnt/nfs/media/media/audiobooks/audible
                - name: LIBATION_CREATE_DB
                  value: "false"
                - name: LIBATION_MASTER_KEY_FILE
                  value: /secrets/libation-master-key/libation-master.key
                # uid 2000 has no passwd entry, so give .NET a writable home
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "4"
                  memory: 2Gi
              volumeMounts:
                - mountPath: /config/Libation
                  name: config
                  subPath: Libation
                - mountPath: /mnt/nfs/media/media/audiobooks/audible
                  name: audiobooks
                  subPath: audible
                - mountPath: /secrets/libation-master-key
                  name: master-key
                  readOnly: true
                - mountPath: /scripts
                  name: scripts
                  readOnly: true
          containers:
            # audiobookshelf can't watch for files written over nfs by another client, so ask it to scan
            - name: audiobookshelf-scan
              image: curl
              env:
                # "Audible" library, folder /audiobooks/audible
                - name: AUDIOBOOKSHELF_LIBRARY_ID
                  value: 64b73ff2-2c46-4c28-bbff-feccc9ad8616
                - name: AUDIOBOOKSHELF_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: libation-audiobookshelf-api-key
                      key: api-key
              # returns as soon as the scan starts, retry so a restarting audiobookshelf doesn't rerun libation
              args:
                - /bin/sh
                - -c
                - >
                  curl
                  --fail
                  --no-progress-meter
                  --retry 5
                  --retry-all-errors
                  --retry-delay 10
                  --request POST
                  --header "Authorization: Bearer ${AUDIOBOOKSHELF_API_KEY}"
                  "http://audiobookshelf.media/api/libraries/${AUDIOBOOKSHELF_LIBRARY_ID}/scan"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: libation-config
            - name: audiobooks
              persistentVolumeClaim:
                claimName: libation-audiobooks
            - name: master-key
              secret:
                secretName: libation-master-key
                defaultMode: 0444
            - name: scripts
              configMap:
                name: libation-cronjob
