apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  labels:
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: tdarr
      app.kubernetes.io/name: tdarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: false
      initContainers:
        # tdarr reads OIDC credentials from a json file, which a secret can't template
        - name: sso-credentials
          image: tdarr
          command:
            - sh
            - -c
            - >-
              printf '{"issuer":"%s","client_id":"%s","client_secret":"%s","redirect_uri":"%s"}'
              "$ISSUER" "$CLIENT_ID" "$CLIENT_SECRET" "$REDIRECT_URI" > /sso/oidc.json &&
              chown 2000:2000 /sso/oidc.json &&
              chmod 600 /sso/oidc.json
          env:
            - name: ISSUER
              value: https://auth.int.fivebytestudios.com
            - name: REDIRECT_URI
              value: https://tdarr.int.fivebytestudios.com/api/v2/public/auth/sso/oidc/callback
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: authelia-oidc-tdarr
                  key: client-id
            # generated with only unreserved url characters, so safe in json without escaping
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-oidc-tdarr
                  key: client-secret
          volumeMounts:
            - mountPath: /sso
              name: sso
      containers:
        - name: tdarr
          image: tdarr
          # https://docs.tdarr.io/docs/installation/variables#tdarr-server-variables
          env:
            - name: PUID
              value: "2000"
            - name: PGID
              value: "2000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: America/Chicago
            - name: serverIP
              value: 0.0.0.0
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            # all transcoding and health checks happen on separate node pods
            - name: internalNode
              value: "false"
            - name: inContainer
              value: "true"
            # https://docs.tdarr.io/docs/other/authentication
            - name: auth
              value: "true"
            - name: seededApiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-key
                  key: api-key
            # https://docs.tdarr.io/docs/other/single-sign-on
            - name: oidcSsoEnabled
              value: "true"
            - name: oidcSsoCredentialsFile
              value: /app/sso/oidc.json
            - name: maxLogSizeMB
              value: "10"
          ports:
            - name: webui
              protocol: TCP
              containerPort: 8265
            - name: server
              protocol: TCP
              containerPort: 8266
          readinessProbe:
            httpGet:
              path: /
              port: webui
          resources:
            requests:
              cpu: 350m
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
          - mountPath: /app/server
            name: server
            subPath: server
          - mountPath: /app/configs
            name: server
            subPath: configs
          - mountPath: /app/logs
            name: logs
          - mountPath: /data
            name: data
          - mountPath: /app/sso
            name: sso
            readOnly: true
      volumes:
        - name: server
          persistentVolumeClaim:
            claimName: tdarr-server
        - name: logs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: tdarr-data
        # keep the client secret off disk
        - name: sso
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
